[build]
  base = "."
  command = "corepack enable && corepack prepare pnpm@10.26.1 --activate && pnpm install && pnpm run typecheck:libs && pnpm --filter @workspace/calculator run build"
  publish = "artifacts/calculator/dist/public"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
