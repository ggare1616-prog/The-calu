[build]
  base = "."
  command = "npm install -g pnpm@10 && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/calculator run build"
  publish = "artifacts/calculator/dist/public"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
